<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Center | BSC TOP Admin</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        
        :root {
            --bg-dark: #08090A;
            --card-bg: #111214;
            --accent: #4A90E2;
            --accent-light: #64B5F6;
            --success: #00C853;
            --error: #FF5252;
            --text-main: #FFFFFF;
            --text-dim: #94A3B8;
        }
        
        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        
        /* --- MODERN HEADER --- */
        .admin-nav {
            background: rgba(17, 18, 20, 0.8);
            backdrop-filter: blur(10px);
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #222;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        
        .brand {
            font-weight: 800;
            font-size: 1.2rem;
        }
        
        .brand span {
            color: var(--accent);
        }
        
        .logout-btn {
            background: rgba(255, 82, 82, 0.1);
            color: var(--error);
            border: 1px solid var(--error);
            padding: 8px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
        }
        
        .logout-btn:hover {
            background: var(--error);
            color: #fff;
        }
        
        .container {
            max-width: 900px;
            margin: 30px auto;
            padding: 0 20px;
            width: 100%;
            box-sizing: border-box;
        }
        
        /* --- TABS SYSTEM --- */
        .tabs-header {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            overflow-x: auto;
            padding-bottom: 5px;
        }
        
        .tab-btn {
            background: var(--card-bg);
            color: var(--text-dim);
            border: 1px solid #222;
            padding: 12px 20px;
            border-radius: 12px;
            cursor: pointer;
            white-space: nowrap;
            font-weight: 600;
            transition: 0.3s;
        }
        
        .tab-btn.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }
        
        .tab-content {
            display: none;
            animation: fadeIn 0.4s ease-out;
        }
        
        .tab-content.active {
            display: block;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        /* --- DASHBOARD CARDS & FORMS --- */
        .glass-card {
            background: var(--card-bg);
            border: 1px solid #222;
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
        }
        
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        
        @media (max-width: 600px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }
        
        .input-group {
            margin-bottom: 18px;
        }
        
        .input-group label {
            display: block;
            font-size: 12px;
            color: var(--text-dim);
            margin-bottom: 8px;
            font-weight: 700;
            text-transform: uppercase;
        }
        
        input,
        select,
        textarea {
            width: 100%;
            padding: 12px 15px;
            background: #1A1B1E;
            border: 1px solid #2A2B2E;
            border-radius: 12px;
            color: #fff;
            font-family: inherit;
            font-size: 14px;
            box-sizing: border-box;
        }
        
        input:focus {
            border-color: var(--accent);
            outline: none;
        }
        
        .submit-btn {
            width: 100%;
            padding: 15px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }
        
        .submit-btn:hover {
            background: var(--accent-light);
            transform: translateY(-2px);
        }
        
        /* --- ITEM LISTS --- */
        .item-row {
            background: #16171A;
            border: 1px solid #222;
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .item-info b {
            color: var(--accent);
        }
        
        .item-actions {
            display: flex;
            gap: 8px;
        }
        
        .action-btn {
            width: 35px;
            height: 35px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .btn-del {
            background: rgba(255, 82, 82, 0.1);
            color: var(--error);
        }
        
        .btn-edit {
            background: rgba(0, 200, 83, 0.1);
            color: var(--success);
        }
        
        #message {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 15px 25px;
            border-radius: 12px;
            color: white;
            display: none;
            z-index: 2000;
            animation: slideIn 0.3s ease;
        }
        
        @keyframes slideIn {
            from {
                transform: translateX(100%);
            }
            
            to {
                transform: translateX(0);
            }
        }
        
        .success {
            background: var(--success);
        }
        
        .error {
            background: var(--error);
        }
    </style>
</head>

<body>
    
    <nav class="admin-nav">
        <div class="brand">BSC <span>TOP</span> Control</div>
        <div id="user-info" style="font-size: 12px; color: var(--text-dim); display: flex; align-items: center; gap: 15px;">
            <span id="welcome-user">Admin</span>
            <button class="logout-btn" onclick="signOut()"><i class="fas fa-sign-out-alt"></i> Exit</button>
        </div>
    </nav>
    
    <div class="container">
        <div class="tabs-header">
            <button class="tab-btn active" onclick="switchTab('material-tab', this)"><i class="fas fa-book"></i> Materials</button>
            <button class="tab-btn" onclick="switchTab('blog-tab', this)"><i class="fas fa-pen-nib"></i> Blogs</button>
            <button class="tab-btn" onclick="switchTab('stats-tab', this)"><i class="fas fa-chart-line"></i> Statistics</button>
        </div>
        
        <div id="message"></div>
        
        <div id="material-tab" class="tab-content active">
            <div class="glass-card">
                <h3 style="margin-top:0"><i class="fas fa-plus-circle"></i> New Material</h3>
                <form id="material-form">
                    <div class="form-grid">
                        <div class="input-group">
                            <label>Type</label>
                            <select id="materialType" name="materialType">
                                <option value="Note">Study Note</option>
                                <option value="Practical">Practical File</option>
                            </select>
                        </div>
                        <div class="input-group">
                            <label>Subject</label>
                            <select id="subject" name="subject">
                                <option value="Math">Math</option>
                                <option value="Physics">Physics</option>
                                <option value="Chemistry">Chemistry</option>
                                <option value="Botany">Botany</option>
                                <option value="Zoology">Zoology</option>
                            </select>
                        </div>
                    </div>
                    <div class="input-group">
                        <label>Title</label>
                        <input type="text" id="chapterName" placeholder="Chapter or Practical Name" required>
                    </div>
                    <div class="form-grid">
                        <div class="input-group">
                            <label>Teacher</label>
                            <input type="text" id="teacherName" placeholder="SK Sir">
                        </div>
                        <div class="input-group">
                            <label>Sender (Student)</label>
                            <input type="text" id="senderStudent" placeholder="Student Name">
                        </div>
                    </div>
                    <div class="input-group">
                        <label>Drive URL</label>
                        <input type="url" id="googleDriveLink" placeholder="https://drive.google.com/..." required>
                    </div>
                    <div style="margin-bottom: 20px; display: flex; align-items: center; gap: 10px;">
                        <input type="checkbox" id="isNew" style="width: auto;"> <label style="margin:0; font-size:14px;">Show "NEW" Badge</label>
                    </div>
                    <button type="submit" class="submit-btn">Publish Material</button>
                </form>
                <hr>
                <div class="admin-card" style="margin-top: 30px; border: 1px solid #EAB308; background: #111; padding: 25px; border-radius: 15px;">
                    <h2 style="color: #EAB308;"><i class="fas fa-video"></i> Manage Lectures</h2>
                    
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                        <input type="text" id="v_title" placeholder="Video Title" style="padding: 12px; border-radius: 8px; border: 1px solid #333; background: #000; color: #fff;">
                        <input type="text" id="v_url" placeholder="YouTube URL" style="padding: 12px; border-radius: 8px; border: 1px solid #333; background: #000; color: #fff;">
                        <select id="v_subject" style="padding: 12px; border-radius: 8px; border: 1px solid #333; background: #000; color: #fff;">
                            <option value="Computer">Computer</option>
                            <option value="Physics">Physics</option>
                            <option value="Math">Math</option>
                            <option value="Chemistry">Chemistry</option>
                        </select>
                        <input type="number" id="v_chapter" placeholder="Chapter No." style="padding: 12px; border-radius: 8px; border: 1px solid #333; background: #000; color: #fff;">
                    </div>
                    <button onclick="addLecture()" style="width: 100%; margin-top: 15px; background: #EAB308; color: black; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;">Publish Video</button>
                    
                    <hr style="margin: 30px 0; border: 0; border-top: 1px solid #222;">
                    
                    <h3 style="color: #fff; font-size: 16px;">Uploaded Lectures</h3>
                    <div id="lecture-list" style="margin-top: 15px;">
                    </div>
                </div>
                
            </div>
            
            <h3>Manage Content</h3>
            <div id="material-list"></div>
        </div>
        
        <div id="blog-tab" class="tab-content">
            <div class="glass-card">
                <h3 style="margin-top:0"><i class="fas fa-rss"></i> Create Blog Post</h3>
                <div class="input-group">
                    <label>Title</label>
                    <input type="text" id="blogTitle" placeholder="Physics Exam Pattern 2026">
                </div>
                <div class="input-group">
                    <label>Thumbnail Image URL</label>
                    <input type="text" id="imageUrl" placeholder="Direct link to image">
                </div>
                <div class="input-group">
                    <label>Content (HTML Supported)</label>
                    <textarea id="blogBody" style="height: 200px;" placeholder="Write your post content here..."></textarea>
                </div>
                <button class="submit-btn" onclick="postBlog()">Publish Blog Post</button>
            </div>
        </div>
        
        <div id="stats-tab" class="tab-content">
            <div id="admin-blog-list"></div>
        </div>
    </div>
    
    <script type="module">
        import { checkAuthAndRedirect, signOut, supabase } from './app.js';
        window.signOut = signOut;
        
        // Tab Switching Logic
        window.switchTab = (tabId, btn) => {
            document.querySelectorAll('.tab-content').forEach(tc => tc.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(tb => tb.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
            if (tabId === 'stats-tab') loadBlogsForAdmin();
        }
        
        // --- CORE FUNCTIONS ---
        function displayMessage(text, type) {
            const m = document.getElementById('message');
            m.textContent = text;
            m.className = type;
            m.style.display = 'block';
            setTimeout(() => m.style.display = 'none', 4000);
        }
        
        // Material Submission
        document.getElementById('material-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            btn.disabled = true;
            btn.innerText = "Processing...";
            
            const payload = {
                material_type: document.getElementById('materialType').value,
                subject: document.getElementById('subject').value,
                chapter_name: document.getElementById('chapterName').value,
                teacher_name: document.getElementById('teacherName').value,
                sender_student: document.getElementById('senderStudent').value,
                google_drive_link: document.getElementById('googleDriveLink').value,
                is_new: document.getElementById('isNew').checked,
            };
            
            const { error } = await supabase.from('materials').insert([payload]);
            btn.disabled = false;
            btn.innerText = "Publish Material";
            
            if (error) displayMessage(error.message, 'error');
            else {
                displayMessage("Published successfully! ✅", "success");
                e.target.reset();
                loadMaterialsForAdmin();
            }
        });
        
        // Load Materials
      // --- Is function ko apne script mein loadMaterialsForAdmin ki jagah replace karein ---

async function loadMaterialsForAdmin() {
    const list = document.getElementById('material-list');
    list.innerHTML = '<p style="text-align:center; color:var(--text-dim);">Fetching materials...</p>';
    
    const { data, error } = await supabase.from('materials').select('*').order('created_at', { ascending: false });
    
    if (error) {
        list.innerHTML = `<p style="color:var(--error)">Error: ${error.message}</p>`;
        return;
    }

    // Data categorization
    const notes = data.filter(m => m.material_type === 'Note');
    const practicals = data.filter(m => m.material_type === 'Practical');

    list.innerHTML = `
        <div style="margin-bottom: 30px;">
            <h4 style="color: #64B5F6; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #222; padding-bottom: 10px;">
                <i class="fas fa-flask"></i> Laboratory Work (Practicals)
                <span style="background:#1A1B1E; font-size:12px; padding:2px 8px; border-radius:10px;">${practicals.length}</span>
            </h4>
            ${practicals.length > 0 ? practicals.map(m => renderAdminItem(m)).join('') : '<p style="font-size:12px; color:#555; padding-left:10px;">No practical files added yet.</p>'}
        </div>

        <div style="margin-bottom: 30px;">
            <h4 style="color: var(--accent); display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #222; padding-bottom: 10px;">
                <i class="fas fa-book"></i> Semester Study Notes
                <span style="background:#1A1B1E; font-size:12px; padding:2px 8px; border-radius:10px;">${notes.length}</span>
            </h4>
            ${notes.length > 0 ? notes.map(m => renderAdminItem(m)).join('') : '<p style="font-size:12px; color:#555; padding-left:10px;">No study notes added yet.</p>'}
        </div>
    `;
}

// Helper: Rendering Single Row with Edit & Delete
function renderAdminItem(m) {
    const icon = m.material_type === 'Practical' ? 'fa-vial' : 'fa-file-alt';
    const accentColor = m.material_type === 'Practical' ? '#64B5F6' : 'var(--accent)';
    
    return `
        <div class="item-row" id="item-${m.id}">
            <div class="item-info">
                <div style="display:flex; align-items:center; gap:10px;">
                    <i class="fas ${icon}" style="color: ${accentColor}; font-size: 18px;"></i>
                    <div>
                        <b style="font-size:14px;">[${m.subject}] ${m.chapter_name}</b>
                        <div style="font-size:11px; color:var(--text-dim); margin-top:2px;">
                            By: ${m.teacher_name || 'Admin'} | Type: ${m.material_type}
                        </div>
                    </div>
                </div>
            </div>
            <div class="item-actions">
                <button onclick="editMaterial(${JSON.stringify(m).replace(/"/g, '&quot;')})" class="action-btn btn-edit" title="Edit Item">
                    <i class="fas fa-edit"></i>
                </button>
                <button onclick="toggleNew(${m.id}, ${m.is_new})" class="action-btn" style="background:rgba(234, 179, 8, 0.1); color:#EAB308;">
                    <i class="fas ${m.is_new ? 'fa-star' : 'fa-certificate'}"></i>
                </button>
                <button onclick="delMaterial(${m.id})" class="action-btn btn-del" title="Delete Item">
                    <i class="fas fa-trash"></i>
                </button>
            </div>
        </div>
    `;
}

// Edit Logic: Yeh function purane data ko form mein bhar dega
window.editMaterial = (item) => {
    document.getElementById('chapterName').value = item.chapter_name;
    document.getElementById('googleDriveLink').value = item.google_drive_link;
    document.getElementById('subject').value = item.subject;
    document.getElementById('materialType').value = item.material_type;
    document.getElementById('teacherName').value = item.teacher_name;
    document.getElementById('senderStudent').value = item.sender_student;
    document.getElementById('isNew').checked = item.is_new;
    
    // Form button ko "Update" mein badalna
    const submitBtn = document.querySelector('#material-form .submit-btn');
    submitBtn.innerHTML = `<i class="fas fa-save"></i> Update Material`;
    submitBtn.style.background = "#00C853";
    
    // Naya event listener add karein update ke liye (pehle wala remove karke)
    document.getElementById('material-form').onsubmit = async (e) => {
        e.preventDefault();
        const { error } = await supabase.from('materials').update({
            chapter_name: document.getElementById('chapterName').value,
            google_drive_link: document.getElementById('googleDriveLink').value,
            subject: document.getElementById('subject').value,
            material_type: document.getElementById('materialType').value,
            teacher_name: document.getElementById('teacherName').value,
            sender_student: document.getElementById('senderStudent').value,
            is_new: document.getElementById('isNew').checked
        }).eq('id', item.id);
        
        if (error) displayMessage(error.message, 'error');
        else {
            displayMessage("Material Updated! ✨", "success");
            setTimeout(() => location.reload(), 1000); // Page reload to reset form and list
        }
    };

    window.scrollTo({ top: 0, behavior: 'smooth' });
}

        
        // 1. वीडियो अपलोड करने का फंक्शन
        window.addLecture = async () => {
            const title = document.getElementById('v_title').value;
            const youtube_url = document.getElementById('v_url').value;
            const subject = document.getElementById('v_subject').value;
            const chapter_no = document.getElementById('v_chapter').value;
            
            if (!title || !youtube_url) return alert("Please fill all details!");
            
            const { error } = await supabase
                .from('lectures')
                .insert([{ title, youtube_url, subject, chapter_no: parseInt(chapter_no) }]);
            
            if (error) alert("Error: " + error.message);
            else {
                alert("Lecture Added!");
                fetchAdminLectures(); // लिस्ट रिफ्रेश करें
            }
        };
        
        // 2. अपलोडेड लेक्चर्स को दिखाने का फंक्शन
        async function fetchAdminLectures() {
            const listDiv = document.getElementById('lecture-list');
            const { data, error } = await supabase.from('lectures').select('*').order('created_at', { ascending: false });
            
            if (data) {
                listDiv.innerHTML = data.map(l => `
            <div style="display: flex; justify-content: space-between; align-items: center; background: #1a1a1a; padding: 10px; border-radius: 8px; margin-bottom: 8px; border-left: 3px solid #EAB308;">
                <div>
                    <div style="font-weight: bold; font-size: 14px;">${l.title}</div>
                    <div style="font-size: 11px; color: #888;">${l.subject} - Ch ${l.chapter_no}</div>
                </div>
                <button onclick="deleteLecture('${l.id}')" style="background: #ff4444; color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer;">
                    <i class="fas fa-trash"></i>
                </div>
            </div>
        `).join('');
            }
        }
        
        // 3. वीडियो डिलीट करने का फंक्शन
        window.deleteLecture = async (id) => {
            if (confirm("Kya aap is video ko delete karna chahte hain?")) {
                const { error } = await supabase.from('lectures').delete().eq('id', id);
                if (error) alert(error.message);
                else fetchAdminLectures();
            }
        };
        
        // पेज लोड होने पर लिस्ट दिखाएं
        document.addEventListener('DOMContentLoaded', fetchAdminLectures);
        
        
        
        // Blog Posting
        window.postBlog = async () => {
            const title = document.getElementById('blogTitle').value;
            const body = document.getElementById('blogBody').value;
            if (!title || !body) return displayMessage("Title & Content required", "error");
            
            const { error } = await supabase.from('blogs').insert([{
                title,
                body,
                image_url: document.getElementById('imageUrl').value,
                author: "Sachin Nitharwal"
            }]);
            
            if (error) displayMessage(error.message, "error");
            else {
                displayMessage("Blog Live! 🚀", "success");
                document.getElementById('blogTitle').value = '';
                document.getElementById('blogBody').value = '';
            }
        }
        
        // Stats & View Loading
        async function loadBlogsForAdmin() {
            const stats = document.getElementById('admin-blog-list');
            const { data } = await supabase.from('blogs').select('*').order('views', { ascending: false });
            stats.innerHTML = data.map(b => `
                <div class="item-row">
                    <div>
                        <b>${b.title}</b>
                        <p style="margin:5px 0 0; font-size:12px; color:var(--text-dim)">👁️ ${b.views || 0} Total Reads</p>
                    </div>
                    <button onclick="delBlog(${b.id})" class="action-btn btn-del"><i class="fas fa-trash"></i></button>
                </div>
            `).join('');
        }
        
        // Delete Handlers
        window.delMaterial = async (id) => {
            if (!confirm("Delete this material?")) return;
            await supabase.from('materials').delete().eq('id', id);
            loadMaterialsForAdmin();
        }
        
        window.delBlog = async (id) => {
            if (!confirm("Delete this blog?")) return;
            await supabase.from('blogs').delete().eq('id', id);
            loadBlogsForAdmin();
        }
        
        window.toggleNew = async (id, current) => {
            await supabase.from('materials').update({ is_new: !current }).eq('id', id);
            loadMaterialsForAdmin();
        }
        
        document.addEventListener('DOMContentLoaded', async () => {
            const session = await checkAuthAndRedirect(true, 'login.html');
            if (session) {
                document.getElementById('welcome-user').textContent = session.user.email.split('@')[0];
                loadMaterialsForAdmin();
            }
        });
    </script>
</body>

</html>
