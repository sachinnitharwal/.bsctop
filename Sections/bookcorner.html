<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Corner | BSC TOP</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');

        :root {
            --bg-pure: #050505;
            --card-bg: rgba(255, 255, 255, 0.03);
            --accent-buy: #22C55E;
            --accent-sell: #EAB308;
            --text-main: #FFFFFF;
            --text-dim: #94A3B8;
        }

        body {
            margin: 0; background-color: var(--bg-pure); color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh; display: flex; flex-direction: column;
        }

        header {
            padding: 15px 20px; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid #1A1A1A; background: rgba(5,5,5,0.8); backdrop-filter: blur(10px);
        }

        .container {
            flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; padding: 40px 20px;
        }

        h3 { font-size: 22px; font-weight: 800; max-width: 500px; margin-bottom: 40px; }
        h3 span { color: var(--accent-buy); }

        .action-wrapper { display: flex; gap: 20px; width: 100%; max-width: 500px; }

        .btn-card {
            flex: 1; background: var(--card-bg); border: 1px solid rgba(255,255,255,0.1);
            padding: 30px 20px; border-radius: 24px; cursor: pointer;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex; flex-direction: column; align-items: center; gap: 15px;
        }

        .btn-card:hover { transform: translateY(-10px); border-color: #fff; }
        .btn-card i { font-size: 30px; }
        .btn-card span { font-weight: 800; font-size: 16px; }

        /* --- MODAL (POPUP) STYLING --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(8px);
            display: none; align-items: center; justify-content: center; z-index: 2000;
        }

        .modal-box {
            background: #111; border: 1px solid var(--accent-sell);
            padding: 40px; border-radius: 30px; max-width: 320px; text-align: center;
            box-shadow: 0 0 30px var(--accent-sell); animation: popIn 0.3s ease;
        }

        @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .modal-box i { font-size: 50px; color: var(--accent-sell); margin-bottom: 20px; }
        .modal-box h2 { margin: 0; font-size: 24px; color: #fff; }
        .modal-box p { color: var(--text-dim); line-height: 1.5; margin: 15px 0 25px; }

        .close-btn {
            background: var(--accent-sell); color: #000; border: none;
            padding: 12px 30px; border-radius: 12px; font-weight: 800; cursor: pointer;
        }

        @media (max-width: 480px) { .action-wrapper { flex-direction: column; } }
    </style>
</head>
<body>

    <header>
        <div style="font-weight: 800;">BSC <span style="color:var(--accent-buy)">TOP</span></div>
        <a href="/index.html" style="color:var(--text-dim); text-decoration:none; font-size:14px;">Home</a>
    </header>

    <div class="container">
        <div style="font-size: 40px; margin-bottom: 20px; color: var(--accent-sell);">
            <i class="fas fa-layer-group"></i>
        </div>
        
        <h3>Book Corner: बुक्स खरीदना और बेचना अब होगा और भी आसान!</h3>

        <div class="action-wrapper">
            <div class="btn-card" onclick="showUpcoming('Buy')">
                <i class="fas fa-shopping-cart" style="color: var(--accent-buy);"></i>
                <span>Buy Books</span>
            </div>

            <div class="btn-card" onclick="showUpcoming('Sell')">
                <i class="fas fa-hand-holding-dollar" style="color: var(--accent-sell);"></i>
                <span>Sell Books</span>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="upcomingModal">
        <div class="modal-box">
            <i class="fas fa-rocket"></i>
            <h2>Coming Soon!</h2>
            <p id="modalMessage">हम इस फीचर पर काम कर रहे हैं। जल्द ही आप यहाँ से बुक्स खरीद और बेच पाएंगे।</p>
            <button class="close-btn" onclick="closeModal()">ठीक है, समझ गया!</button>
        </div>
    </div>

    <script>
        function showUpcoming(type) {
            const modal = document.getElementById('upcomingModal');
            const msg = document.getElementById('modalMessage');
            
            if(type === 'Buy') {
                msg.innerText = "Buy Books फीचर अभी तैयार हो रहा है। बहुत जल्द आप यहाँ बेहतरीन सेकंड-हैंड बुक्स देख पाएंगे।";
            } else {
                msg.innerText = "अपनी पुरानी बुक्स बेचने का फीचर जल्द आ रहा है। अपनी बुक्स संभाल कर रखें!";
            }
            
            modal.style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('upcomingModal').style.display = 'none';
        }

        // Close on clicking outside
        window.onclick = function(event) {
            const modal = document.getElementById('upcomingModal');
            if (event.target == modal) {
                closeModal();
            }
        }
    </script>
</body>
</html>
