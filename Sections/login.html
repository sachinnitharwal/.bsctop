<!DOCTYPE html>
<html lang="en">
<head>
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BSC Top Admin</title>
    <link rel="stylesheet" href="style.css"> 
    <style>
        /* Minimal CSS for display if style.css is missing */
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: #f4f4f4; }
        .container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); width: 300px; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .error-message { color: red; margin-top: 10px; font-weight: bold; }
    </style>
    

</head>
<body>

    <div class="container">
        <h2>🔒 Admin Login</h2>
        <form id="login-form">
            <input type="email" id="email" placeholder="Admin Email" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit">Log In</button>
            <div id="error-message" class="error-message"></div>
        </form>
    </div>

    <script type="module">
        // Import the necessary functions from your external app.js file
        import { signIn, checkAuthAndRedirect } from '/app.js'; 

        document.addEventListener('DOMContentLoaded', () => {
            // Check if the user is ALREADY logged in. If so, redirect them away to the admin page.
            checkAuthAndRedirect(false, 'login.html'); 
        });

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error-message');
            
            // Clear previous message and indicate loading
            errorDiv.textContent = 'Logging in...'; 

            const result = await signIn(email, password);

            if (!result.success) {
                // Display the error returned from the signIn function
                errorDiv.textContent = 'Login failed: ' + result.error;
            }
            // On success, the signIn function in app.js handles the redirect to admin_section.html.
        });
    </script>
</body>
</html>
