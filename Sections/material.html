<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Materials Hub | BSC TOP</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script> 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');

        :root {
            --bg-pure: #050505;
            --card-bg: #111111;
            --accent: #6366F1;
            --viewlabel: #F2F2F2;
            --accent-glow: rgba(99, 102, 241, 0.4);
            --text-main: #FFFFFF;
            --text-dim: #94A3B8;
        }

        body {
            background-color: var(--bg-pure);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0; padding: 0;
        }

        /* --- STICKY NAV --- */
        .main-header {
            background: rgba(5, 5, 5, 0.8);
            backdrop-filter: blur(10px);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1A1A1A;
            position: sticky; top: 0; z-index: 1000;
        }

        .brand-logo { margin: 0; font-size: 20px; font-weight: 800; }
        .brand-logo span { color: var(--accent); text-shadow: 0 0 15px var(--accent-glow); }

        .content-wrapper { padding: 25px 20px; max-width: 600px; margin: 0 auto; }

        /* --- SUBJECT BOXES (GRADIENT LOOK) --- */
        .view-label { 
            font-size: 11px; color: var(--viewlabel); font-weight: 800; 
            text-transform: uppercase; letter-spacing: 2px; margin-bottom: 20px; display: block;
        }

        .subject-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-bottom: 35px; }
        
        .subject-box {
            background: var(--card-bg);
            border: 1px solid #1F1F1F;
            padding: 30px 15px;
            border-radius: 24px;
            text-align: center;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative; overflow: hidden;
        }

        .subject-box::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.1), transparent);
            opacity: 0; transition: 0.3s;
        }

        .subject-box:hover { 
            border-color: var(--accent); 
            transform: translateY(-8px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.5), 0 0 15px rgba(99, 102, 241, 0.1);
        }
        
        .subject-box:hover::before { opacity: 1; }

        .subject-box i { 
            font-size: 32px; color: var(--accent); margin-bottom: 15px; display: block;
            filter: drop-shadow(0 0 8px var(--accent-glow));
        }

        .subject-box h3 { margin: 0; font-size: 14px; font-weight: 700; color: #fff; }

        /* --- DETAIL VIEW (CLEAN CARDS) --- */
        #detailView { display: none; animation: slideUp 0.5s ease; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

        .back-nav {
            display: inline-flex; align-items: center; gap: 10px; margin-bottom: 25px;
            cursor: pointer; color: #fff; font-weight: 600; font-size: 13px;
            background: #1A1A1A; padding: 10px 18px; border-radius: 14px;
        }

        /* --- PREMIUM MATERIAL CARD --- */
        .material-card {
            background: linear-gradient(145deg, #161616, #0F0F0F);
            border: 1px solid #222;
            border-radius: 22px; padding: 20px;
            margin-bottom: 18px;
            position: relative;
        }

        .card-top { display: flex; align-items: center; gap: 18px; margin-bottom: 18px; }

        .icon-box { 
            width: 50px; height: 50px; background: #1A1A1A; 
            border-radius: 15px; display: flex; align-items: center; justify-content: center;
            color: var(--accent); font-size: 20px; border: 1px solid #262626;
        }

        .subject-info h3 { margin: 0; font-size: 16px; font-weight: 700; color: #fff; flex-grow: 1; }
        
        .view-btn {
            text-decoration: none; background: var(--accent); color: white;
            padding: 10px 20px; border-radius: 12px; font-size: 12px; font-weight: 800;
            transition: 0.3s; border: none; cursor: pointer;
        }

        .view-btn:hover { transform: scale(1.05); box-shadow: 0 5px 15px var(--accent-glow); }

        /* --- PILLS (GLASS LOOK) --- */
        .card-footer { display: flex; flex-wrap: wrap; gap: 10px; border-top: 1px solid #1F1F1F; padding-top: 18px; }
        
        .pill { 
            font-size: 10px; padding: 6px 14px; border-radius: 10px; font-weight: 700; 
            display: flex; align-items: center; gap: 8px; background: #1A1A1A; color: var(--text-dim);
            border: 1px solid #262626;
        }

        .pill i { color: var(--accent); font-size: 12px; }

        .loading-state { text-align: center; padding: 100px 0; color: var(--text-dim); }
    </style>
</head>
<body>

    <header class="main-header">
        <h1 class="brand-logo">BSC <span>TOP</span></h1>
        <div style="width: 40px; height: 40px; background: #1A1A1A; border-radius: 50%; display: flex; align-items: center; justify-content: center;">
            <i class="fas fa-bell" style="font-size: 16px; color: var(--text-dim);"></i>
        </div>
    </header>

    <main class="content-wrapper">
        
        <div id="mainView">
            <span class="view-label">📚 Semester 1  Class notes</span>
            <div class="subject-grid" id="subjectsGrid">
                <div class="loading-state"><i class="fas fa-circle-notch fa-spin"></i></div>
            </div>

            <span class="view-label">🔬 Laboratory Work</span>
            <div class="subject-grid">
                <div class="subject-box" onclick="showPracticals('Physics')">
                    <i class="fas fa-flask-vial"></i>
                    <h3>Physics</h3>
                </div>
                <div class="subject-box" onclick="showPracticals('Chemistry')">
                    <i class="fas fa-vial-circle-check"></i>
                    <h3>Chemistry</h3>
                </div>
            </div>
        </div>

        <div id="detailView">
            <div class="back-nav" onclick="goBack()"><i class="fas fa-chevron-left"></i> Back to Hub</div>
            <h2 id="activeSubjectName" style="font-size: 28px; font-weight: 800; margin: 0 0 25px 0;">Subject</h2>
            <div id="cardsContainer"></div>
        </div>

    </main>

    <script type="module">
        import { supabase } from './app.js'; 

        let allNotes = [];

        async function load() {
            try {
                const { data, error } = await supabase.from('materials').select('*').eq('material_type', 'Note').order('created_at', {ascending: false});
                if (error) throw error;
                allNotes = data;

                const grid = document.getElementById("subjectsGrid");
                const subjects = [...new Set(data.map(n => n.subject))];
                grid.innerHTML = '';
                
                subjects.forEach(sub => {
                    const div = document.createElement('div');
                    div.className = 'subject-box';
                    div.onclick = () => showNotes(sub);
                    div.innerHTML = `<i class="fas fa-book-open-reader"></i><h3>${sub}</h3>`;
                    grid.appendChild(div);
                });
            } catch (e) { grid.innerHTML = "Offline"; }
        }

        window.showNotes = (sub) => {
            toggle('detail');
            document.getElementById('activeSubjectName').innerText = sub;
            const filtered = allNotes.filter(n => n.subject === sub);
            document.getElementById('cardsContainer').innerHTML = filtered.map(n => renderCard(n.chapter_name, n.google_drive_link, n.teacher_name, n.sender_student)).join('');
        };

        window.showPracticals = (type) => {
            toggle('detail');
            document.getElementById('activeSubjectName').innerText = type + " Practicals";
            // Example Data - Add your links here
            const data = type === 'Physics' ? [{name: "Searle Exp","compound pendulum" link: "https://drive.google.com/file/d/1sH3aWtB94FSuUUwotOA_30D9_Uxm74GZ/view?usp=drivesdk","https://drive.google.com/file/d/1t39fHTZLiIi-FdGtGwFxH_o5RCoIgcFf/view?usp=drivesdk" t: "Physics Dept","Physics Dept" s: "Sachin","Sachin"}] : [];
            document.getElementById('cardsContainer').innerHTML = data.map(p => renderCard(p.name, p.link, p.t, p.s)).join('') || "No Files";
        }

        function renderCard(title, link, t, s) {
            return `
                <div class="material-card">
                    <div class="card-top">
                        <div class="icon-box"><i class="fas fa-file-lines"></i></div>
                        <div class="subject-info"><h3>${title}</h3></div>
                        <a href="${link}" target="_blank" class="view-btn">View</a>
                    </div>
                    <div class="card-footer">
                        <div class="pill"><i class="fas fa-chalkboard-user"></i> ${t || 'Teacher'}</div>
                        <div class="pill"><i class="fas fa-user-graduate"></i> ${s || 'Admin'}</div>
                    </div>
                </div>
            `;
        }

        function toggle(v) {
            document.getElementById('mainView').style.display = v === 'main' ? 'block' : 'none';
            document.getElementById('detailView').style.display = v === 'detail' ? 'block' : 'none';
            window.scrollTo(0,0);
        }

        window.goBack = () => toggle('main');
        document.addEventListener('DOMContentLoaded', load);
    </script>
</body>
</html>
