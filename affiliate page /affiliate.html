<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Affiliate Products</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
    }h1 {
  text-align: center;
  margin-bottom: 20px;
}

.container {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 20px;
  max-width: 1000px;
  margin: auto;
}

.card {
  background: white;
  border-radius: 10px;
  padding: 15px;
  box-shadow: 0 2px 5px rgba(0,0,0,0.1);
  text-align: center;
}

.card img {
  width: 100%;
  height: 180px;
  object-fit: cover;
  border-radius: 8px;
}

.title {
  font-size: 16px;
  font-weight: bold;
  margin: 10px 0;
}

.price {
  color: green;
  font-weight: bold;
  margin: 5px 0;
}

.btn {
  display: inline-block;
  margin-top: 10px;
  padding: 10px 15px;
  background: #007bff;
  color: white;
  text-decoration: none;
  border-radius: 5px;
}

.btn:hover {
  background: #0056b3;
}

  </style>
</head>
<body>  <h1>Affiliate Products</h1>  <div class="container"><!-- PRODUCT 1 -->
<div class="card">
  <img src="https://m.media-amazon.com/images/I/51dctBN77rL._SL1500_.jpg" alt="Product Image">
  <div class="title">Product Name Here</div>
  <div class="price">₹999</div>
  <!-- PUT YOUR AFFILIATE LINK BELOW -->
  <a href="https://amzn.to/4o96Lhu" class="btn" target="_blank" rel="nofollow">Buy Now</a>
</div>

<!-- PRODUCT 2 -->
<div class="card">
  <img src="IMG_20250930_134832_178.jpg" alt="Product Image">
  <div class="title">Another Product</div>
  <div class="price">₹649</div>
  <!-- PUT YOUR AFFILIATE LINK BELOW -->
  <a href="https://www.amazon.in/GETSABLE-Waterproof-Silicone-Compatible-Samsung/dp/B0FMYPDHKS?tag=sachin0550-21" class="btn" target="_blank" rel="nofollow">Buy Now</a>
</div>

<!-- PRODUCT 3 -->
<div class="card">
  <img src="https://via.placeholder.com/300" alt="Product Image">
  <div class="title">New Useful Product</div>
  <div class="price">₹499</div>
  <!-- PUT YOUR AFFILIATE LINK BELOW -->
  <a href="YOUR_AFFILIATE_LINK_HERE" class="btn" target="_blank" rel="nofollow">Buy Now</a>
</div>

  </div></body>
</html>
