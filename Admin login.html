<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Section</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }
    
    th,
    td {
      border: 1px solid black;
      padding: 6px;
      text-align: center;
    }
    
    th {
      background: #f2f2f2;
    }
    
    button {
      padding: 5px 10px;
    }
    
    #adminArea {
      display: none;
    }
  </style>
</head>

<body>
  
  <h2>Admin Login</h2>
  <input type="text" name="Username" id="Username" placeholder="Admin,Enter your name" />
  <input type="password" id="adminPass" placeholder="Enter Password">
  <button onclick="checkPass()">Login</button>
  <hr />
  <h2>Admin section</h2>
  <p id="outputArea"></p>
  <p id="lastUpdated"></p>
  
  <script>
    function accessInput() {
      // 1. Get a reference to the input element using its ID
      let inputElement = document.getElementById('Username');
      
      // 2. Access the value entered by the user
      let userName = inputElement.value;
      let pass = document.getElementById("adminPass").value;
      // 3. You can now use the 'userName' variable, e.g., display it
      if (pass === "055005") {
        document.getElementById('outputArea').textContent = 'Welcome,' + userName;
      } else {
        document.getElementById('outputArea').textContent = 'Wrong password: ' + userName;
      }
    }
    
    function checkPass(){
      accessInput();
      let inputElement = document.getElementById('Username');
      let userName = inputElement.value;
      let lastModified = document.lastModified
      document.getElementById('lastUpdated').textContent = 'Hey :' + userName + ',The site was last updated on ' + lastModified
    }

      if (pass === "055005") {
        document.getElementById("adminArea").style.display = "block";
        loadPending();
      } else {
        alert("Wrong Password!");
      }
    }*/
  </script>
  
</body>

</html>
